# On a version tag (v0.1.0, ...), builds the four installer packages and attaches them to that tag's GitHub release.
# The upload uses the gh tool that the runners already have and the workflow's own GITHUB_TOKEN; no third-party
# actions are involved.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the VERSION file
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build JARVIS-Setup.exe and JARVIS-windows.zip
        run: python installer/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/JARVIS-Setup.exe
            dist/JARVIS-windows.zip
          if-no-files-found: error

  # Built twice at the same time, on an Apple-silicon Mac and on an Intel Mac, and the release takes the first that is
  # there: GitHub sometimes has no Apple-silicon Mac free for an hour or more (v0.1.18 waited through four tries), and a
  # release must not wait on that. Either build makes the same packages, for both kinds of Mac.
  mac:
    strategy:
      fail-fast: false
      matrix:
        machine: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.machine }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build JARVIS's two small Mac programs (for both kinds of Mac)
        run: bash installer/mac/build_helper.sh dist
      - name: Build JARVIS-mac.zip
        run: python3 installer/mac/build.py
      - name: Build JARVIS.dmg
        run: bash installer/mac/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.machine }}
          path: |
            dist/JARVIS-mac.zip
            dist/JARVIS.dmg
          if-no-files-found: error

  release:
    needs: [windows, mac]
    # (always: one of the two Mac builds may never have found a machine; the step below needs only one of them.)
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mac-*
          path: mac
      - name: Take one Mac build
        run: |
          for one in mac/mac-macos-latest mac/mac-macos-15-intel; do
            if [ -f "$one/JARVIS-mac.zip" ] && [ -f "$one/JARVIS.dmg" ]; then
              cp "$one/JARVIS-mac.zip" "$one/JARVIS.dmg" dist/
              echo "The Mac packages come from $one."
              break
            fi
          done
          test -f dist/JARVIS-mac.zip && test -f dist/JARVIS.dmg || { echo "Neither Mac build finished." >&2; exit 1; }
      - name: Attach the packages to the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/JARVIS-Setup.exe dist/JARVIS-windows.zip dist/JARVIS-mac.zip dist/JARVIS.dmg \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/JARVIS-Setup.exe dist/JARVIS-windows.zip dist/JARVIS-mac.zip dist/JARVIS.dmg \
              --title "JARVIS $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
