# Runs the whole test suite on Windows, macOS and Linux for every push and pull request, and on Windows also
# builds the installer and installs, upgrades and uninstalls it in a temporary folder.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        # bash on every system (Git Bash on Windows), so "tests/*.test.js" is expanded the same way everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Windows installer (build, install, upgrade, uninstall in a temporary folder)
        if: runner.os == 'Windows'
        run: python installer/windows/test_install.py
