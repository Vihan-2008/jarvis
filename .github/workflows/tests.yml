# Runs the whole test suite on Windows, macOS and Linux for every push and pull request, and on Windows also
# builds the installer and installs, upgrades and uninstalls it in a temporary folder. On a real Mac it then checks
# what tests can only stand in for: the windows, pressing and typing in another app, pictures of the screen, the
# wake word model, the helper that measures the Mac's own sound, the menu-bar icon, the shortcuts and dictation
# (scripts/mac_live_check.py).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        # bash on every system (Git Bash on Windows), so "tests/*.test.js" is expanded the same way everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python -m unittest discover -s tests -t .
      - name: JavaScript tests
        if: ${{ !cancelled() }}
        run: node --test tests/*.test.js
      - name: Windows installer (build, install, upgrade, uninstall in a temporary folder)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python installer/windows/test_install.py

  mac-live:
    name: on a real Mac (other apps' windows, typing, the screen, the wake word, the Mac's own sound)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The wake word's parts (two Python packages and its model, fetched and checked)
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy onnxruntime
          python scripts/get_wake_word.py "$RUNNER_TEMP/wake-models"
      - name: Build JARVIS's two small Mac programs (the sound helper and the menu-bar icon)
        if: ${{ !cancelled() }}
        run: bash installer/mac/build_helper.sh "$RUNNER_TEMP/helper"
      - name: The Mac installer installs into a temporary folder
        if: ${{ !cancelled() }}
        run: |
          bash installer/mac/install.sh --quiet --no-obsidian --no-wake-word --no-login --install-dir "$RUNNER_TEMP/JARVIS" \
            --bundle-dir "$RUNNER_TEMP/Apps" --vault "$RUNNER_TEMP/Vault"
          test -s "$RUNNER_TEMP/Apps/JARVIS.app/Contents/Resources/AppIcon.icns"
          test ! -e "$HOME/Library/LaunchAgents/local.jarvis.background.plist"
          test -x "$RUNNER_TEMP/Apps/JARVIS.app/Contents/MacOS/JARVIS"
          test -x "$RUNNER_TEMP/JARVIS/bin/jarvis-sound-level"
          test -x "$RUNNER_TEMP/JARVIS/bin/jarvis-menu"
          plutil -lint "$RUNNER_TEMP/Apps/JARVIS.app/Contents/Info.plist"
      - name: Check JARVIS's hands, eyes and ears on this Mac
        if: ${{ !cancelled() }}
        run: >
          python scripts/mac_live_check.py --sound-helper "$RUNNER_TEMP/helper/jarvis-sound-level"
          --menu-helper "$RUNNER_TEMP/helper/jarvis-menu" --wake-models "$RUNNER_TEMP/wake-models"
      - name: From the downloaded package, as a person would (its questions answered), then opened and uninstalled
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist && cp "$RUNNER_TEMP/helper/jarvis-menu" "$RUNNER_TEMP/helper/jarvis-sound-level" "$RUNNER_TEMP/helper/jarvis-launcher" dist/
          python installer/mac/build.py --out "$RUNNER_TEMP/package"
          ditto -x -k "$RUNNER_TEMP/package/JARVIS-mac.zip" "$RUNNER_TEMP/package/unpacked"
          setup="$RUNNER_TEMP/package/unpacked/JARVIS Installer/Install JARVIS.command"
          test -x "$setup"
          echo "what the unpacked package shows:"; ls "$RUNNER_TEMP/package/unpacked/JARVIS Installer"
          # The questions, in order: start at login? yes. Open JARVIS now? no. Then Return closes the window.
          printf 'y\nn\n\n' | "$setup" --no-wake-word --no-obsidian --install-dir "$RUNNER_TEMP/JARVIS2" \
            --bundle-dir "$RUNNER_TEMP/Apps2" --vault "$RUNNER_TEMP/Vault2"
          app="$RUNNER_TEMP/Apps2/JARVIS.app"
          agent="$HOME/Library/LaunchAgents/local.jarvis.background.plist"
          plutil -lint "$app/Contents/Info.plist" "$agent"
          test -s "$app/Contents/Resources/AppIcon.icns"
          file "$app/Contents/MacOS/JARVIS" | grep -q "Mach-O" && echo "JARVIS.app holds a real program"
          codesign --verify --verbose=1 "$app" && echo "JARVIS.app is signed on this Mac"
          plutil -p "$agent"
          test -f "$RUNNER_TEMP/Vault2/Start here.md"
          # Does macOS end what an app started once the app's own process has ended? (A JARVIS.app that opened a
          # window which could not connect, while the same command typed in Terminal worked, pointed that way.)
          probe="$RUNNER_TEMP/Probe.app"; mkdir -p "$probe/Contents/MacOS"
          plutil -create xml1 "$probe/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string probe "$probe/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string local.jarvis.probe "$probe/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$probe/Contents/Info.plist"
          plutil -insert LSUIElement -bool true "$probe/Contents/Info.plist"
          printf '#!/bin/bash\nsleep 300 &\necho $! > "%s/probe-same"\n/usr/bin/python3 -c "import subprocess; print(subprocess.Popen([\\"sleep\\", \\"301\\"], start_new_session=True).pid)" > "%s/probe-own"\nsleep 2\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" > "$probe/Contents/MacOS/probe"
          chmod 755 "$probe/Contents/MacOS/probe"
          open -W "$probe"; sleep 3
          if kill -0 "$(cat "$RUNNER_TEMP/probe-same")" 2>/dev/null; then echo "probe: what an app starts in its own group outlives it"; else echo "probe: what an app starts in its own group ENDS with it"; fi
          if kill -0 "$(cat "$RUNNER_TEMP/probe-own")" 2>/dev/null; then echo "probe: what it starts in a session of its own outlives it"; else echo "probe: even a session of its own ends with it"; fi
          # Opened the way the login item opens it (through macOS's own "open", in the background).
          open -g -j -a "$app" --args --background
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8765/ && echo "JARVIS answers at 127.0.0.1:8765"
          # Still there well after the app's launcher has done its work and ended.
          sleep 20
          if pgrep -f "Apps2/JARVIS.app/Contents/MacOS/JARVIS" >/dev/null; then echo "(the launcher is still running)"; fi
          curl -fsS -o /dev/null http://127.0.0.1:8765/ || { echo "JARVIS stopped once the app's launcher ended"; exit 1; }
          echo "JARVIS still answers 20 seconds after the app's launcher ended"
          echo "the app's log:"; tail -n 5 "$HOME/Library/Logs/JARVIS/launcher.log" || true
          grep -q "JARVIS opened from its app" "$HOME/Library/Logs/JARVIS/launcher.log" || { echo "the app's log says nothing"; exit 1; }
          for i in $(seq 1 20); do pgrep -f "JARVIS2/bin/jarvis-menu" >/dev/null && break; sleep 1; done
          pgrep -fl "JARVIS2/bin/jarvis-menu" && echo "the menu-bar icon is running"
          bash "$RUNNER_TEMP/JARVIS2/uninstall.sh" --quiet
          sleep 2
          if curl -fsS -o /dev/null http://127.0.0.1:8765/; then echo "JARVIS is still running after the uninstall"; exit 1; fi
          if pgrep -f "JARVIS2/bin/jarvis-menu"; then echo "the menu-bar icon is still running"; exit 1; fi
          test ! -e "$RUNNER_TEMP/JARVIS2" && test ! -e "$app" && test ! -e "$agent"
          test -f "$RUNNER_TEMP/Vault2/Start here.md"
          echo "uninstalled: app, app bundle and login item gone; the notes vault kept"
      - name: Opened from its icon with the notes in Documents (a folder macOS guards)
        if: ${{ !cancelled() }}
        run: |
          vault="$HOME/Documents/JARVIS Vault (check)"
          bash installer/mac/install.sh --quiet --no-obsidian --no-wake-word --no-login --install-dir "$RUNNER_TEMP/JARVIS3" \
            --bundle-dir "$RUNNER_TEMP/Apps3" --vault "$vault"
          app="$RUNNER_TEMP/Apps3/JARVIS.app"
          open -g -j -a "$app" --args --background
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          page="$(curl -fsS http://127.0.0.1:8765/ || true)"
          token="$(printf '%s' "$page" | sed -n 's/.*const TOKEN="\([^"]*\)".*/\1/p' | head -n 1)"
          echo "answers: $([ -n "$page" ] && echo yes || echo no)"
          state="$(curl -fsS -H "X-JCC-Token: $token" http://127.0.0.1:8765/api/state || echo '{}')"
          ok="$(printf '%s' "$state" | python3 -c 'import json, sys; print((json.load(sys.stdin).get("vault") or {}).get("ok"))' 2>/dev/null || echo unknown)"
          echo "JARVIS, opened from its icon, can reach the notes vault in Documents: $ok"
          echo "the app's log:"; tail -n 8 "$HOME/Library/Logs/JARVIS/launcher.log" || true
          echo "the service's log:"; tail -n 8 "$HOME/Library/Application Support/JarvisCommand/service.log" || true
          bash "$RUNNER_TEMP/JARVIS3/uninstall.sh" --quiet
          rm -rf "$vault"
          [ "$ok" = True ] || { echo "JARVIS opened from its icon could not reach the notes in Documents"; exit 1; }
      - name: An update installed by JARVIS's own helper and started again, and one that fails, rolled back
        if: ${{ !cancelled() }}
        run: |
          python installer/mac/build.py --out "$RUNNER_TEMP/upd"
          bash installer/mac/install.sh --quiet --no-obsidian --no-wake-word --no-login --install-dir "$RUNNER_TEMP/JARVIS5" \
            --bundle-dir "$RUNNER_TEMP/Apps5" --vault "$RUNNER_TEMP/Vault5"
          app="$RUNNER_TEMP/JARVIS5"; state="$HOME/Library/Application Support/JarvisCommand"; py="$(head -n 1 "$app/.python")"
          open -g -j -a "$RUNNER_TEMP/Apps5/JARVIS.app" --args --background
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8765/ && echo "JARVIS $(cat "$app/VERSION") answers"
          python - "$RUNNER_TEMP/upd/JARVIS-mac.zip" "$RUNNER_TEMP/upd" <<'MAKE'
          import hashlib, sys, zipfile
          source, out = sys.argv[1], sys.argv[2]
          for version, broken in (("9.9.9", False), ("9.9.10", True)):
              target = f"{out}/{version}.zip"
              with zipfile.ZipFile(source) as old, zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as new:
                  for info in old.infolist():
                      data = old.read(info)
                      if info.filename.endswith(".jarvis-app/VERSION"):
                          data = (version + "\n").encode()
                      elif broken and info.filename.endswith(".jarvis-app/jcc/__main__.py"):
                          data = b"raise SystemExit('this version never starts')\n"
                      new.writestr(info, data)
              open(target + ".sha256", "w").write(hashlib.sha256(open(target, "rb").read()).hexdigest())
          MAKE
          "$py" -I jcc/update_helper.py --package "$RUNNER_TEMP/upd/9.9.9.zip" --sha256 "$(cat "$RUNNER_TEMP/upd/9.9.9.zip.sha256")" \
            --version 9.9.9 --app-dir "$app" --state "$state" --start background
          [ "$(cat "$app/VERSION")" = 9.9.9 ] || { echo "the app is not the new version"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8765/ || { echo "the new version does not answer"; exit 1; }
          echo "updated to 9.9.9 by the helper: stopped, installed, started again, and it answers"
          if "$py" -I jcc/update_helper.py --package "$RUNNER_TEMP/upd/9.9.10.zip" --sha256 "$(cat "$RUNNER_TEMP/upd/9.9.10.zip.sha256")" \
              --version 9.9.10 --app-dir "$app" --state "$state" --start background; then echo "a version that never starts was kept"; exit 1; fi
          [ "$(cat "$app/VERSION")" = 9.9.9 ] || { echo "the version before was not put back"; exit 1; }
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8765/ || { echo "the version put back does not answer"; exit 1; }
          echo "a version that never started was rolled back to 9.9.9, which answers again"
          echo "the update log:"; tail -n 25 "$state/update.log"
          bash "$app/uninstall.sh" --quiet
